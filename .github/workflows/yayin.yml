name: Netywork yayin
on:
  schedule:
    - cron: "*/10 5-15 * * *"   # Türkiye saatiyle 08:00-18:59 arası her 10 dakikada bir
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yayin
  cancel-in-progress: false
jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Saati gelenleri paylas
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python yayinla.py
      - name: Durumu kaydet
        run: |
          git config user.name "netywork-yayin"
          git config user.email "yayin@users.noreply.github.com"
          git add durum.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "yayin durumu" && git pull --rebase && git push)
